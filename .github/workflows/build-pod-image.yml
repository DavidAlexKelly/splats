# Builds the rented-GPU image on GitHub's Linux machines and pushes it to Docker Hub, so no
# local Docker build is needed (handy on Apple Silicon Macs, which can't build it natively).
#
# One-time setup (repo on GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   DOCKERHUB_USERNAME   your Docker Hub username
#              DOCKERHUB_TOKEN      a Docker Hub access token (Read & Write)
#   Variables: IMAGE                e.g. yourname/splat-pod  (a private Docker Hub repository)
#
# Run: Actions tab → "Build pod image" → Run workflow.
#   First time: full build (about 2-4 hours). It pushes yourname/splat-pod:base-<tag> (the big
#   dependency layer) and yourname/splat-pod:<tag> (what RunPod uses).
#   Code changes later: untick "rebuild base", give a new tag and the base tag to reuse:
#   a few minutes.
name: Build pod image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (use this in your RunPod template)"
        required: true
        default: "1.0.0"
      rebuild_base:
        description: "Rebuild the base (dependencies, ~2-4 h). Untick for code-only changes."
        type: boolean
        default: true
      base_tag:
        description: "Base tag to build on when not rebuilding it (the tag of your last full build)"
        required: false
        default: "1.0.0"
      gpus:
        description: "GPU generations: 120 = RTX 50xx, 89 = RTX 40xx/L4, 86 = RTX 30xx/A10, 75 = RTX 20xx/T4"
        default: "89;120"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check settings
        run: |
          test -n "${{ vars.IMAGE }}" || { echo "::error::Set the IMAGE variable (Settings > Secrets and variables > Actions > Variables), e.g. yourname/splat-pod"; exit 1; }
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || { echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets"; exit 1; }

      - name: Free disk space (the image needs ~40 GB while building)
        if: ${{ inputs.rebuild_base }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
                      /usr/local/share/powershell /usr/local/lib/node_modules /opt/microsoft || true
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out tags and GPU lists
        id: cfg
        run: |
          gpus="${{ inputs.gpus }}"
          # 89 -> 8.9, 120 -> 12.0 (PyTorch's notation)
          torch=$(echo "$gpus" | tr ';' '\n' | sed -E 's/^([0-9]+)([0-9])$/\1.\2/' | paste -sd';')
          if [ "${{ inputs.rebuild_base }}" = "true" ]; then base="${{ inputs.tag }}"; else base="${{ inputs.base_tag }}"; fi
          echo "cuda_archs=$gpus" >> "$GITHUB_OUTPUT"
          echo "torch_archs=$torch" >> "$GITHUB_OUTPUT"
          echo "base=${{ vars.IMAGE }}:base-$base" >> "$GITHUB_OUTPUT"
          echo "GPUs: $gpus (torch: $torch); base image: ${{ vars.IMAGE }}:base-$base"

      - name: Build and push the base image (CUDA 12.8, COLMAP, gsplat, models)
        if: ${{ inputs.rebuild_base }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.cfg.outputs.base }}
          build-args: |
            MAX_JOBS=2
            CUDA_BASE=12.8.1
            TORCH_CUDA=cu128
            CUDA_ARCHS=${{ steps.cfg.outputs.cuda_archs }}
            TORCH_ARCHS=${{ steps.cfg.outputs.torch_archs }}

      - name: Free the build cache before the pod layer
        if: ${{ inputs.rebuild_base }}
        run: docker buildx prune -af || true; df -h /

      - name: Build and push the pod image (SSH, runner, /workspace)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pod
          platforms: linux/amd64
          push: true
          tags: ${{ vars.IMAGE }}:${{ inputs.tag }}
          build-args: |
            BASE=${{ steps.cfg.outputs.base }}

      - name: Done
        run: |
          echo "### Pushed \`${{ vars.IMAGE }}:${{ inputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Use it as the container image in your RunPod template." >> "$GITHUB_STEP_SUMMARY"
