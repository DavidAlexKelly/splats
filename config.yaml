# splat_pipeline config. Anything omitted falls back to the defaults in the script.

extract:
  fps: 6              # raw extraction rate; the select stage thins this out
  max_frames: 0       # 0 = whole video
  keep_raw: false     # delete raw frames after selection to save disk

select:
  target_fps: 3       # keep the sharpest frame in every (fps / target_fps) window
                      # 3 = more viewpoints than 2 (patio v1 used 2); helps blur on weak sides
  min_sharpness: 0    # Laplacian-variance floor; check pipeline.log for typical values

slice:
  # How each 360 frame is cut into normal (pinhole) camera views:
  #   cubemap  6 non-overlapping 90 deg faces (front/right/back/left/up/down). Every part of
  #            the sphere appears exactly once, so training sees no duplicated pixels and SfM
  #            has ~3x fewer images than the old 17-view layout.
  #   custom   the overlapping `views` list below (more matching overlap inside each frame,
  #            but much more redundant data for training).
  layout: cubemap
  # cubemap_faces: [front, right, back, left, down]   # e.g. drop "up" for open-sky scenes
  size: 1600          # px per view. 8K equirect = ~1920 px native per 90 deg view
  fov_deg: 90         # cubemap: 90 = faces meet exactly. 95-100 adds a small overlap margin
  # Used when layout: custom. [yaw, pitch] in degrees; positive pitch looks up. A 90 deg view
  # covers +/-45 deg around its pitch, so keep the pitch -45 views or the ground under the
  # camera path comes out as a hole.
  views:
    - [0, 0]
    - [45, 0]
    - [90, 0]
    - [135, 0]
    - [180, 0]
    - [225, 0]
    - [270, 0]
    - [315, 0]
    - [0, 45]
    - [90, 45]
    - [180, 45]
    - [270, 45]
    - [0, 90]
    - [0, -45]
    - [90, -45]
    - [180, -45]
    - [270, -45]
  # Pixels below this latitude are ignored by SfM and training, so the drone/stick/stitch
  # seam at the very bottom of the 360 frame isn't baked into the floor. The floor right under
  # one frame is still filled in from neighbouring frames as the camera moves.
  # null = use everything (if your stitched footage is clean all the way down).
  nadir_mask_deg: -75
  jpeg_quality: 95
  workers: 8

sfm:
  colmap_bin: tools/COLMAP.bat   # Windows release; on Linux/containers just: colmap
  # "auto"          global mapper first; if it places < auto_min_registered of the images,
  #                 the incremental one (best of both: usually minutes, never worse coverage)
  # "colmap"        incremental mapper: robust, slow (patio: ~30-60 min even on 27 cores)
  # "colmap_global" COLMAP 4.x built-in GLOMAP: usually minutes for the same data
  # "glomap"        standalone GLOMAP binary (glomap_bin)
  # "mapanything"   hybrid: MapAnything predicts metric poses in minutes, then COLMAP
  #                 triangulates + bundle-adjusts them (precision from COLMAP, real-world
  #                 metres from MapAnything). Falls back to `mapanything.fallback` on failure.
  # Incremental is the proven default. With rig: true, colmap_global is worth trying: it was
  # unreliable on the 2,782 independent images of the first patio run, but a rig turns that
  # into ~214 frame poses.
  mapper: auto
  auto_min_registered: 0.9
  auto_global_timeout_min: 20    # "auto": give up on the global mapper after this long
  glomap_bin: glomap
  matcher: sequential    # "sequential" for video; "exhaustive" for small (<~500 image) sets
  # Neighbouring 360 frames each image is matched against (quadratic spacing: 1, 2, 4, 8...
  # frames away, so 8 reaches 128 frames back for loop closure).
  sequential_overlap_frames: 8
  # Treat the views of each 360 frame as one camera rig: same centre, known rotations.
  # COLMAP then solves one pose per frame instead of one per view: faster mapping, no views
  # drifting off on their own, and the global mapper becomes practical. Needs COLMAP 3.12+.
  rig: true
  use_gpu: true
  max_features: 8192     # 4096 roughly halves matching time
  fix_intrinsics: true   # intrinsics are known exactly from the slicing, so don't refine them
  mapanything:
    python: ""             # Python with MapAnything installed; "" = the one running the pipeline.
                           # e.g. venv-ma/Scripts/python.exe if you keep it in a separate venv
    fallback: colmap       # mapper to use if the MapAnything route fails ("" = stop instead)
    refine_rounds: 2       # COLMAP triangulate + bundle-adjust passes
    min_observations: 30   # images with fewer triangulated points after refinement are dropped
    settings:
      model: facebook/map-anything-apache   # Apache-2.0 weights (commercial use OK)
      views: auto          # view indices fed to MapAnything; auto = 4 horizontal views per frame
      window_frames: 16    # 360 frames per call (x4 views = 64 images). 8 GB GPU: 8-16. A100: 64+
      overlap_frames: 4    # frames shared between windows, used to stitch them together
      window_scale: estimate
      minibatch_size: 1    # lowest GPU memory

gate:
  min_registered_ratio: 0.7   # fraction of images SfM must place
  min_parallax_ratio: 0.05    # camera path extent / median scene depth

train:
  backend: custom        # key into the commands below. "custom" = train_gsplat.py
  iterations: 30000

  # Settings for the built-in trainer (train_gsplat.py)
  custom:
    strategy: mcmc       # mcmc keeps a fixed Gaussian budget, so VRAM use is predictable
    cap_max: auto        # Gaussian budget from GPU memory: 3M (16 GB) / 4M (24 GB) / 5M (32 GB) / 6M
    sh_degree: 3
    downscale: 1         # 2 = train at half resolution (~4x less memory per image)
    ssim_lambda: 0.2
    random_background: false
    packed: true
    cache_images: false  # true keeps images in RAM: ~12 GB for 1,562 x 1600px views
    loader_threads: 4
    log_every: 100
    save_every: 5000     # checkpoint interval; interrupted runs resume from the last one
    align: true          # rotate scene upright + centre it, using the known 360 view directions
    up_axis: "+y"        # "+y" SuperSplat/PlayCanvas/three.js, "+z" Blender/Unreal, "-y" raw COLMAP
    world_scale: 1.0     # COLMAP units are arbitrary. Measure something (e.g. the door) in the
                         # viewer and set this to real_size / viewer_size
    exposure: true       # per-photo exposure/white-balance correction (reduces blur + floaters)
    exposure_lr: 0.001
    exposure_reg: 0.01
    bilagrid: false      # per-photo local colour grids. Off: they let floaters hide (dark blobs)
    bilagrid_tv: 10.0    # smoothness of those corrections (higher = gentler)
    antialiased: true    # Mip-Splatting style anti-aliasing (tick "Anti-aliased" in the viewer)
    test_every: 20       # hold out every 20th image to score quality honestly (0 = off)
    eval_every: 5000     # how often to print the held-out score

    # Monocular depth prior: steadies walls/floors where the capture is thin (see depth_prior.py)
    depth_prior: true
    depth_backend: auto        # auto = Depth Anything 3 mono if installed, else DA2 Small (both Apache-2.0)
    depth_model: ""            # empty = backend default
    depth_process_res: 756     # DA3 inference size (multiple of 14); higher = sharper, slower
    depth_batch: 8             # lower to 2-4 if the prior step runs out of GPU memory
    depth_mode: selective      # selective = only where SfM geometry is weak; uniform = everywhere
    depth_min_weight: 0.15     # how much the prior still counts where SfM points are dense
    depth_weight: 0.1          # loss weight at the start; decays to depth_weight * depth_end_ratio
    depth_end_ratio: 0.1
    depth_grad_weight: 1.0     # surface-shape term (keeps flat things flat)
    depth_min_points: 30       # SfM points an image needs for its prior to be trusted
    depth_max_rel_error: 0.35  # priors that don't fit the SfM points this well are ignored

    # Filling gaps from real data only (scene_fill.py) - no AI-generated content
    depth_seed: true           # extra starting Gaussians from the depth prior where SfM is thin
    depth_seed_max_points: 300000
    depth_seed_min_weight: 0.5 # only where the prior's coverage weight marks SfM as sparse
    sky_shell: true            # far-away sphere of Gaussians for sky/distant background
    sky_points: 100000         # capped at 10% of cap_max
    sky_radius_mult: 3.0
    prune: true                # floater cleanup before export (ckpt.pt keeps everything)
    prune_max_psnr_drop: 0.05  # cleanup is undone/lightened if held-out PSNR falls more
    prune_min_opacity: 0.005   # MCMC keeps many faint Gaussians that matter together
    prune_near_camera: 0.02    # x scene scale: specks hugging the flight path
    prune_max_scale: 1.0       # x scene scale: oversized blobs (sky shell exempt)
    prune_outlier_std: 3.0     # isolated specks; 0 = off

  # Extra placeholders available to the templates, e.g. {gsplat_dir}
  vars:
    gsplat_dir: /opt/gsplat
  # Each command is a list; placeholders: {data} {train_dir} {export_dir} {iterations} {name}
  # {python} {script_dir} {config_path} plus anything in vars.
  commands:
    custom:
      - "{python}"
      - "{script_dir}/train_gsplat.py"
      - --data
      - "{data}"
      - --out
      - "{train_dir}"
      - --iterations
      - "{iterations}"
      - --config
      - "{config_path}"
    nerfstudio:
      - ns-train
      - splatfacto
      - --data
      - "{data}"
      - --output-dir
      - "{train_dir}"
      - --max-num-iterations
      - "{iterations}"
      - --viewer.quit-on-train-completion
      - "True"
      # If you run out of GPU memory with many images, try:
      # - --pipeline.datamanager.cache-images
      # - cpu
      - colmap
      - --colmap-path
      - sparse/0
      - --images-path
      - images
      - --downscale-factor
      - "1"
    gsplat:
      - python
      - "{gsplat_dir}/examples/simple_trainer.py"
      - default
      - --data_dir
      - "{data}"
      - --data_factor
      - "1"
      - --result_dir
      - "{train_dir}"
      - --max_steps
      - "{iterations}"
      - --save_ply
      - --disable_viewer

export:
  # Optional post-training export. {config} = newest config.yml found under train_dir.
  # If a backend has no entry, the newest .ply under train_dir is used directly.
  commands:
    nerfstudio:
      - ns-export
      - gaussian-splat
      - --load-config
      - "{config}"
      - --output-dir
      - "{export_dir}"

fixer:
  # AI fill-in with NVIDIA Fixer (fixer_refine.py; pod_run.py runs it after each splat).
  # Needs a bfloat16 GPU (RTX 30xx or newer, A100...; not the T4). Weights: NVIDIA Open Model
  # License (commercial use allowed). Results contain AI-generated content.
  rounds: 3              # progressive rounds, each further from the real flight path
  views_per_round: 200   # new viewpoints rendered and cleaned per round
  steps_per_round: 1500  # training steps after each round
  novel_ratio: 0.3       # share of training steps on cleaned new views (the rest: real photos)
  novel_weight: 0.3      # their loss weight relative to real photos
  max_shift: 0.15        # how far off the path the last round goes, x scene size
  yaw_jitter: 35         # degrees of extra turn left/right
  pitch_jitter: 25       # degrees of extra tilt up/down
  render_width: 1024     # Fixer's native 16:9 resolution
  render_height: 576
  hfov: 90               # field of view of the new viewpoints, degrees across
  timestep: 250          # Fixer's single denoising step (NVIDIA's setting)
  gate: raw              # judge each round on real photos as viewers see them
  max_round_drop: 0.3    # undo a round that costs more held-out PSNR than this, and stop
  opacity_entropy: 0.003 # push Gaussians to solid-or-gone: clears see-through haze (0 = off)
  appearance_warmup: auto # fit colour corrections first (2 steps per photo), so 'before' is fair
  previews: 6            # render | Fixer | real photo triplets saved per round
